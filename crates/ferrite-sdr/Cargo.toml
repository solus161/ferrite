[package]
name = "ferrite-sdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Terminal FM receiver for RTL-SDR dongles, sized for small screens"

[dependencies]
sdr-core = { path = "../sdr-core" }
cpal = "0.18.1"
libc = "0.2"
ratatui = "0.30.2"
rtlsdr_mt = "2.2.0"

[features]
# PipeWire audio backend for cpal. Needs libpipewire-0.3-dev, libspa-0.2-dev and clang.
# Without it, cpal uses ALSA (needs libasound2-dev).
pipewire = ["cpal/pipewire"]
